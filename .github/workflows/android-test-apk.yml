name: Publish the verified MoneyTrack testing APK
on:
  push:
    branches: [verify/moneytrack-3.0]
permissions:
  actions: read
  checks: read
  contents: write
jobs:
  retry:
    if: ${{ github.repository == 'Muahid1312/MoneyTrack' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retry the rate-limited main build
        run: |
          repo="$GITHUB_REPOSITORY"
          run=45174742461
          test "$(gh run view "$run" -R "$repo" --json headSha --jq .headSha)" = "42a24c69f051af0ea223f8cc43533a3c9c7a8dfd"
          test "$(gh run view "$run" -R "$repo" --json conclusion --jq .conclusion)" = "failure"
          gh run rerun "$run" -R "$repo" --failed
          for n in {1..20}; do
            attempt="$(gh run view "$run" -R "$repo" --json attempt --jq .attempt)"
            if test "$attempt" -ge 2; then exit 0; fi
            sleep 6
          done
          exit 1
  deliver:
    needs: retry
    if: ${{ github.repository == 'Muahid1312/MoneyTrack' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_COMMIT: 42a24c69f051af0ea223f8cc43533a3c9c7a8dfd
      VERIFIED_RUN: '45174742461'
    steps:
      - uses: actions/checkout@v5
      - name: Verify the main workflow result
        run: |
          test "$(gh run view "$VERIFIED_RUN" --json headSha --jq .headSha)" = "$VERIFIED_COMMIT"
          gh run watch "$VERIFIED_RUN" --interval 25 --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: MoneyTrack-3.4.0-debug-test-apk
          path: build/device-apk
          github-token: ${{ github.token }}
          run-id: 45174742461
      - name: Verify the APK, signer and version
        run: |
          set -eu
          cd build/device-apk
          btools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$btools"
          "$btools" verify --verbose --print-certs app-debug.apk > signer.txt
          grep -F 'CN=Android Debug' signer.txt
          "$(dirname "$btools")/aapt" dump badging app-debug.apk > manifest.txt
          grep -E "^package: name='com.moneytrack.moneytrack' versionCode='8' versionName='3.4.0'" manifest.txt
          expected="$(awk 'NR==1{print $1}' app-debug.apk.sha256)"
          test "$expected" = "$(sha256sum app-debug.apk | cut -d ' ' -f 1)"
          mv app-debug.apk MoneyTrack-3.4.0-debug.apk
          sha256sum MoneyTrack-3.4.0-debug.apk > MoneyTrack-3.4.0-debug.apk.sha256
      - uses: actions/download-artifact@v4
        with:
          name: MoneyTrack-3.4.0-android-screens
          path: build/review-frames
          github-token: ${{ github.token }}
          run-id: 45174742461
      - name: Make review sheet from the Android renders
        run: |
          python3 -m venv "$RUNNER_TEMP/image-tools"
          "$RUNNER_TEMP/image-tools/bin/pip" install -q 'Pillow==11.3.0'
          "$RUNNER_TEMP/image-tools/bin/python" - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageStat
          from pathlib import Path
          files=sorted(Path('build/review-frames').glob('*.png'))
          assert len(files)==18, [f.name for f in files]
          for f in files:
              with Image.open(f) as im:
                  assert im.height > im.width and min(im.size) >= 320 and max(ImageStat.Stat(im.convert('RGB')).stddev)>10, f.name
          names=['calendar','weekly','entry','accounts','statistics','more','group-members','group-settlement','calendar-dark']
          labels=['Calendar','Weekly','Add expense','Accounts','Statistics','More','Trip members','Settlement','Dark calendar']
          out=Image.new('RGB',(930,1788),'white')
          d=ImageDraw.Draw(out)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',17)
          for i,(n,label) in enumerate(zip(names,labels)):
              with Image.open(Path('build/review-frames')/(n+'.png')) as im:
                  im.thumbnail((290,548),Image.Resampling.LANCZOS)
                  x=(i%3)*310+(310-im.width)//2; y=(i//3)*596
                  d.text((x,y+4),label,fill='#232323',font=font)
                  out.paste(im.convert('RGB'),(x,y+33))
          out.save('build/device-apk/MoneyTrack-Android-preview.jpg','JPEG',quality=88,optimize=True)
          print('Verified 18 populated Android screen captures.')
          PY
      - name: Publish the Android testing prerelease
        run: |
          tag='v3.4.0-test.2'
          test -z "$(git ls-remote --tags origin "refs/tags/$tag")"
          cat > "$RUNNER_TEMP/test-notes.md" <<'NOTES'
          MoneyTrack 3.4.0 (Android build 8) adds a calendar-based ledger with Daily, Calendar, Weekly, Monthly and Total views, quick transaction entry, separate wallet cash and savings balances, and a searchable Groups & Trips workflow.

          Download **MoneyTrack-3.4.0-debug.apk** for Android device testing. The GitHub runner signed this build with an Android debug certificate. Export an encrypted backup before testing with an existing ledger. An in-place Android update requires a matching signing certificate.

          Flutter analysis completed with zero errors, and all 142 regression tests passed. The SQLite checks cover populated upgrades through schema 7. The Android 11 walkthrough captures 18 screens using a synthetic ledger.

          [Verification run](https://github.com/Muahid1312/MoneyTrack/actions/runs/45174742461) · [Redesign report and screenshots](https://github.com/Muahid1312/MoneyTrack/blob/42a24c69f051af0ea223f8cc43533a3c9c7a8dfd/docs/moneytrack-redesign-report.md)
          NOTES
          printf '\nAPK SHA-256 `%s`.\n' "$(cut -d ' ' -f 1 build/device-apk/MoneyTrack-3.4.0-debug.apk.sha256)" >> "$RUNNER_TEMP/test-notes.md"
          grep 'certificate SHA-256 digest:' build/device-apk/signer.txt | head -1 >> "$RUNNER_TEMP/test-notes.md"
          gh release create "$tag" --target "$VERIFIED_COMMIT" --prerelease --latest=false --title 'MoneyTrack 3.4.0 for Android testing (revision 2)' --notes-file "$RUNNER_TEMP/test-notes.md" build/device-apk/MoneyTrack-3.4.0-debug.apk build/device-apk/MoneyTrack-3.4.0-debug.apk.sha256 build/device-apk/MoneyTrack-Android-preview.jpg
