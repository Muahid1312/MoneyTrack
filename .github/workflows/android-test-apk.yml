name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      visual_review:
        description: Capture the app on an Android emulator
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[checks only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.6'
          cache: true
      - name: Resolve dependencies
        run: bash tool/ci_capture.sh 'Dependency resolution' flutter pub get --enforce-lockfile
      - name: Check SQLite migration and rollback SQL
        run: python3 tool/check_sqlite.py
      - name: Format sources in the build workspace
        run: dart format lib test
      - name: Analyze
        run: bash tool/ci_capture.sh 'Flutter analysis' flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK for device testing
        run: bash tool/ci_capture.sh 'Android debug build' flutter build apk --debug
      - name: Record artifact checksum
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/app-debug.apk.sha256
      - name: Upload debug-signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTrack-3.4.0-debug-test-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Run automated tests
        run: bash tool/ci_capture.sh 'Automated tests' bash tool/run_flutter_tests.sh

      - name: Prepare Android walkthrough
        if: ${{ inputs.visual_review || contains(github.event.head_commit.message, '[visual review]') }}
        run: |
          bash tool/ci_capture.sh 'Android walkthrough build' flutter build apk --debug --no-pub --target-platform=android-x64 --target=integration_test/visual_review_test.dart
          (cd android && ./gradlew --stop)
          df -h .
      - name: Enable emulator acceleration
        if: ${{ inputs.visual_review || contains(github.event.head_commit.message, '[visual review]') }}
        run: sudo chmod a+rw /dev/kvm
      - name: Capture Android screens
        if: ${{ inputs.visual_review || contains(github.event.head_commit.message, '[visual review]') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          ram-size: 1536M
          heap-size: 256M
          disk-size: 2048M
          cores: 2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 780x1560
            adb shell wm density 320
            bash tool/ci_capture.sh 'Android visual walkthrough' flutter drive --no-pub --use-application-binary=build/app/outputs/flutter-apk/app-debug.apk --driver=test_driver/visual_review.dart --target=integration_test/visual_review_test.dart -d emulator-5554
      - name: Upload Android screenshots
        if: ${{ always() && (inputs.visual_review || contains(github.event.head_commit.message, '[visual review]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTrack-3.4.0-android-screens
          path: build/visual-review
          if-no-files-found: warn
          retention-days: 14

  tests-only:
    if: ${{ contains(github.event.head_commit.message, '[checks only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.6'
          cache: true
      - run: bash tool/ci_capture.sh 'Dependency resolution' flutter pub get --enforce-lockfile
      - run: bash tool/ci_capture.sh 'Automated tests' bash tool/run_flutter_tests.sh
