name: MoneyTrack 4.0 preview APK
on:
  push:
    branches: [verify/moneytrack-3.0]
permissions:
  contents: read
env:
  BUILD_COMMIT: 5f092d890f624b8573d3e0667d0d65059ec2204a
  APK_NAME: MoneyTrack-4.0.0-preview-debug.apk
  RELEASE_TAG: v4.0.0-dev.1
jobs:
  verify-and-build:
    if: github.repository == 'Muahid1312/MoneyTrack'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.6'
          cache: true
      - name: Resolve dependencies
        run: bash tool/ci_capture.sh 'Dependency resolution' flutter pub get --enforce-lockfile
      - name: Check SQLite migration and rollback SQL
        run: python3 tool/check_sqlite.py
      - name: Analyze
        run: bash tool/ci_capture.sh 'Flutter analysis' flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Build APK for device testing
        run: |
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          bash tool/ci_capture.sh 'Android preview APK' flutter build apk --no-pub --debug --build-name=4.0.0-dev.1 --build-number=9
      - name: Verify the APK signing certificate, version and checksum
        run: |
          mkdir -p build/device-apk
          cp build/app/outputs/flutter-apk/app-debug.apk "build/device-apk/$APK_NAME"
          cd build/device-apk
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$signer" verify --verbose --print-certs "$APK_NAME" > signer.txt
          grep -F 'CN=Android Debug' signer.txt
          "$(dirname "$signer")/aapt" dump badging "$APK_NAME" > manifest.txt
          grep -F "package: name='com.moneytrack.moneytrack' versionCode='9' versionName='4.0.0-dev.1'" manifest.txt
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
      - name: Upload device-testing APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTrack-4.0-preview-APK
          path: build/device-apk/
          retention-days: 14
          if-no-files-found: error
      - name: Run automated tests
        run: bash tool/ci_capture.sh 'Automated tests' bash tool/run_flutter_tests.sh

  deliver:
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MoneyTrack-4.0-preview-APK
          path: device-apk
      - name: Publish the Android testing prerelease
        run: |
          cd device-apk
          sha256sum -c "$APK_NAME.sha256"
          cat > "$RUNNER_TEMP/moneytrack-apk-notes.md" <<'NOTES'
          Android device-testing build for the redesigned MoneyTrack app. The APK includes the customizable appearance settings, Managed Funds foundation, Home dashboard, Budgets, Accounts and transaction keypad.

          Download the APK and its SHA-256 checksum below. The GitHub runner signed it with an Android debug certificate. Android requires a matching signing certificate for an in-place update. Export an encrypted backup from your installed app before device testing.
          NOTES
          printf '\n[Source commit](https://github.com/%s/commit/%s) · [Build and tests](https://github.com/%s/actions/runs/%s)\n\nAPK SHA-256 `%s`\n\n' "$GITHUB_REPOSITORY" "$BUILD_COMMIT" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cut -d ' ' -f 1 "$APK_NAME.sha256")" >> "$RUNNER_TEMP/moneytrack-apk-notes.md"
          grep 'certificate SHA-256 digest:' signer.txt | head -1 >> "$RUNNER_TEMP/moneytrack-apk-notes.md"
          gh release create "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --repo "$GITHUB_REPOSITORY" --target "$BUILD_COMMIT" --prerelease --latest=false --title 'MoneyTrack 4.0 Android preview' --notes-file "$RUNNER_TEMP/moneytrack-apk-notes.md"
