name: Android test APK

on:
  push:
    branches: [main, verify/moneytrack-3.0]
  workflow_dispatch:
    inputs:
      visual_review:
        description: Capture the app on an Android emulator
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-walkthrough:
    if: ${{ inputs.visual_review || contains(github.event.head_commit.message, '[visual review]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.6'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: android-walkthrough-input
          path: build/walkthrough
          github-token: ${{ github.token }}
          run-id: 45165852934
      - name: Resolve driver dependencies
        run: bash tool/ci_capture.sh 'Driver dependencies' flutter pub get --enforce-lockfile
      - name: Prepare emulator storage and KVM
        run: |
          sudo chmod a+rw /dev/kvm
          # These preinstalled toolchains are unused on this disposable Android-only runner.
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/moneytrack-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/moneytrack-avd"
          df -h .
      - name: Install Android 30 emulator image
        run: |
          bash tool/ci_capture.sh 'Android system image' "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-30;aosp_atd;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name moneytrack -k 'system-images;android-30;aosp_atd;x86_64'
          df -h .
      - name: Start Android emulator
        run: bash tool/ci_capture.sh 'Emulator boot' bash tool/start_visual_emulator.sh
      - name: Capture Android screens
        run: bash tool/ci_capture.sh 'Android visual walkthrough' flutter drive --no-pub --use-application-binary=build/walkthrough/app-debug.apk --driver=test_driver/visual_review.dart --target=integration_test/visual_review_test.dart -d emulator-5554
      - name: Upload Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTrack-3.4.0-android-screens
          path: build/visual-review
          if-no-files-found: error
          retention-days: 14

