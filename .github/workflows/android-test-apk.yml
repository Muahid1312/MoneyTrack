name: Android test APK
on:
  push:
    branches: [verify/moneytrack-3.0]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Read the synthetic Android test failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45168645598/logs" > "$RUNNER_TEMP/test-log.zip"
          python3 - "$RUNNER_TEMP/test-log.zip" <<'PY'
          import sys,zipfile,re
          with zipfile.ZipFile(sys.argv[1]) as z:
              m=next(p for p in z.namelist() if p.endswith('_Capture Android screens.txt'))
              log=z.read(m).decode(errors='replace')
          i=log.find('StateError was thrown')
          snippet=log[max(0,i-600):i+4200]
          snippet=re.sub(r'\d{4}-\d\d-\d\dT[\d:.]+Z\s*','',snippet)
          msg=snippet.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::warning title=Walkthrough stack::'+msg)
          PY
